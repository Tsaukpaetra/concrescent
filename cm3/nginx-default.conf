server {
    # START_SSL_CONFIG
    listen 443 ssl;
    http2 on;
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # END_SSL_CONFIG

    listen 80;
    server_name SERVER_DOMAIN_NAME;
    root /var/www/html;

    # Certbot validation (Always needed even in SSL mode)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # Serve Vue frontend (fall back to index.html for SPA routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================
    # Backend
    # ==========================================
    location /api {
        include fastcgi_params;
        fastcgi_pass app:9000; # Connects to the php-fpm container service
        # Force NGINX to pass "index.php" to PHP-FPM, ignoring the incoming URL file path
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param REQUEST_URI $request_uri;

        # START_PROXY_CONFIG
        # in case we're begind another reverse proxy
        real_ip_header X-Forwarded-For;
        set_real_ip_from PROXY_NEXT_HOP;
        fastcgi_param REMOTE_ADDR $remote_addr;
        # END_PROXY_CONFIG

    }
}